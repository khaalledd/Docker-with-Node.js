version: '3'
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # depends_on:
    #   - node-app
  node-app:
    build: .
    # ports:
    #   - "3000:4000"
    environment:
      - PORT=4000
    depends_on:
      - mongo
  mongo: 
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=Mohsen
      - MONGO_INITDB_ROOT_PASSWORD=myPassword
    volumes:
      - mongo-db:/data/db
  redis:
    image: redis

# named volume
volumes:
  mongo-db:     
      